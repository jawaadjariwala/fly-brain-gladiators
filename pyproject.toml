[project]
name = "fly-brain-gladiators"
version = "0.1.0"
description = "Gladiator arena driven by the MaleCNS Drosophila connectome. Nothing trained."
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbg"]
